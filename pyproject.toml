[project]
name = "tasks-proto"
version = "0.1.0"
description = "A Django web task manager based on the GTD methodology"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.4.6",
    "celery>=5.6.3",
    "channels>=4.0.0",
    "channels-redis>=4.2.0",
    "django>=5.2.16",
    "django-celery-beat>=2.7.0",
    "django-viewflow>=2.3.2",
    "django-unfold>=0.91.0",
    "flower>=2.0.1",
    "gunicorn>=26.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.1.1",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.0",
    "whitenoise>=6.9.0",
    "django-vite>=3.1.0",
    "dj-email-url>=1.0.6",
    "django-storages>=1.14.0",
    "boto3>=1.43.59",
    "python-magic>=0.4.27",
    "django-ninja>=1.6.2",
    "celery-redbeat>=2.4.2",
    "markdown>=3.10.2",
    "nh3>=0.3.6",
    "markdownify>=1.2.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=7.0.0",
    "django-extensions>=4.1",
    "factory-boy>=3.3.3",
    "ipython>=9.15.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.2.1",
    "pytest-django>=4.11.1",
    "ruff>=0.16.0",
]

[tool.ruff.lint]
select = ["F", "I", "T10"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"core/settings/*.py" = ["F405", "F403"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
